# Add inside the `server { ... }` block of
# /etc/nginx/sites-enabled/greenlight.sundialwire.com
# Serves the cord set catalog published hourly by cordset-catalog-sync.service.
# Public product data, so any origin may read it (no credentials).
location = /cordset/cordsets.catalog.json {
	alias /var/www/cordset/cordsets.catalog.json;
	default_type application/json;
	add_header Access-Control-Allow-Origin * always;
	add_header Cache-Control "public, max-age=300" always;
}
